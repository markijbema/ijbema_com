title: "Mark IJbema"
description: "Optimizing software development processes with a no-nonsense pragmatic approach"
url: "https://markijbema.github.io"
baseurl: "/ijbema_com"
repository: "markijbema/ijbema_com"
email: "mark@ijbema.com"
linkedin_url: "https://www.linkedin.com/in/markijbema/"

markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
